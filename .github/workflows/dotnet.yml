name: Standalone Python & Qiling Test Matrix

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test-qiling:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- LINUX ---
          - name: "Linux x64"
            os: ubuntu-latest
            arch_triple: "x86_64-unknown-linux-gnu"
            flavor: "install_only"
            py_bin: "python/bin/python3"

          - name: "Linux ARM64"
            os: ubuntu-24.04-arm
            arch_triple: "aarch64-unknown-linux-gnu"
            flavor: "install_only"
            py_bin: "python/bin/python3"

          # --- MACOS ---
          - name: "macOS x64 (Intel)"
            os: macos-15-intel
            arch_triple: "x86_64-apple-darwin"
            flavor: "install_only"
            py_bin: "python/bin/python3"

          - name: "macOS ARM64 (Apple Silicon)"
            os: macos-latest
            arch_triple: "aarch64-apple-darwin"
            flavor: "install_only"
            py_bin: "python/bin/python3"

          # --- WINDOWS ---
          - name: "Windows x64"
            os: windows-latest
            arch_triple: "x86_64-pc-windows-msvc"
            flavor: "install_only"
            py_bin: "python/python.exe"
            msvc_arch: "x64"

          - name: "Windows x86 (32-bit)"
            os: windows-latest
            arch_triple: "i686-pc-windows-msvc"
            flavor: "install_only"
            py_bin: "python/python.exe"
            msvc_arch: "x86"

          - name: "Windows ARM64"
            os: windows-11-arm
            arch_triple: "aarch64-pc-windows-msvc"
            flavor: "install_only"
            py_bin: "python/python.exe"
            msvc_arch: "arm64"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Compiler Environment (Windows Only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Download & Extract Standalone Python
        run: |
          PYTHON_VER="3.12.13"
          RELEASE_TAG="20260510"
          TRIPLE="${{ matrix.arch_triple }}"
          FLAVOR="${{ matrix.flavor }}"
          
          BASE_URL="https://github.com/astral-sh/python-build-standalone/releases/download/${RELEASE_TAG}"
          BASE_NAME="cpython-${PYTHON_VER}+${RELEASE_TAG}-${TRIPLE}-${FLAVOR}"

          FULL_TAR_GZ_URL="${BASE_URL}/${BASE_NAME}.tar.gz"
          FULL_TAR_ZST_URL="${BASE_URL}/${BASE_NAME}.tar.zst"
          FULL_ZIP_URL="${BASE_URL}/${BASE_NAME}.zip"

          echo "Target Triple: ${TRIPLE}"
          echo "Checking URL: ${FULL_TAR_GZ_URL}"

          if curl -sSL -f -o python_archive.tar.gz "$FULL_TAR_GZ_URL"; then
            echo "Downloaded from: ${FULL_TAR_GZ_URL}"
            tar -xf python_archive.tar.gz
          elif curl -sSL -f -o python_archive.tar.zst "$FULL_TAR_ZST_URL"; then
            echo "Downloaded from: ${FULL_TAR_ZST_URL}"
            tar -xf python_archive.tar.zst
          elif curl -sSL -f -o python_archive.zip "$FULL_ZIP_URL"; then
            echo "Downloaded from: ${FULL_ZIP_URL}"
            unzip -q python_archive.zip
          else
            echo "Error: Failed to download asset from ${BASE_URL}"
            exit 1
          fi

      - name: Verify Python & Pip
        run: |
          ./${{ matrix.py_bin }} --version
          ./${{ matrix.py_bin }} -m pip --version

      - name: Install Qiling Framework (Build Native ARM64 from Source)
        run: |
          PY_ABS_PATH="$(pwd)/${{ matrix.py_bin }}"
          echo "Python path: $PY_ABS_PATH"

          "$PY_ABS_PATH" -m pip install --upgrade pip setuptools wheel ninja cmake

          if [ "${{ runner.os }}" = "Windows" ] && [ "${{ matrix.msvc_arch }}" = "arm64" ]; then
            export CMAKE_GENERATOR="Ninja"
            export CMAKE_BUILD_TYPE="Release"

            # ----------------------------------------------------
            # A. Capstone
            # ----------------------------------------------------
            echo "=== Installing Capstone ==="
            "$PY_ABS_PATH" -m pip install capstone

            # ----------------------------------------------------
            # B. Keystone Engine (Native ARM64 Source Build)
            # ----------------------------------------------------
            echo "=== Building Keystone Engine for ARM64 ==="
            git clone --depth 1 https://github.com/keystone-engine/keystone.git
            
            # Patch Keystone CMake policy
            "$PY_ABS_PATH" -c "p='keystone/CMakeLists.txt'; f=open(p); c=f.read().replace('cmake_minimum_required(VERSION 2.8.12)', 'cmake_minimum_required(VERSION 3.10)').replace('cmake_policy(SET CMP0051 OLD)', 'cmake_policy(SET CMP0051 NEW)'); open(p,'w').write(c)"

            # Build Keystone C/C++ DLL via Ninja for ARM64
            mkdir -p keystone/build_arm64
            cd keystone/build_arm64
            cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=ARM64 -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86" ..
            ninja
            cd "$GITHUB_WORKSPACE"

            # Copy generated keystone.dll into binding target path
            mkdir -p keystone/bindings/python/keystone
            find keystone/build_arm64 -name "keystone.dll" -exec cp {} keystone/bindings/python/keystone/ \;

            # Install Keystone Python bindings
            cd keystone/bindings/python
            "$PY_ABS_PATH" setup.py install
            cd "$GITHUB_WORKSPACE"

            # ----------------------------------------------------
            # C. Unicorn Engine (Native ARM64 Source Build)
            # ----------------------------------------------------
            echo "=== Building Unicorn Engine for ARM64 ==="
            git clone --depth 1 https://github.com/unicorn-engine/unicorn.git

            # 1. Disable MASM assembler and setjmp x86 wrapper on Windows ARM64
            "$PY_ABS_PATH" -c "p='unicorn/CMakeLists.txt'; f=open(p); c=f.read().replace('enable_language(ASM_MASM)', '').replace('qemu/util/setjmp-wrapper-win32.asm', ''); open(p,'w').write(c)"

            # 2. Fix unresolved __rdtsc() linker symbol across all unicorn source files
            "$PY_ABS_PATH" -c "import os; [open(os.path.join(r, fn), 'w', encoding='utf-8').write(open(os.path.join(r, fn), 'r', encoding='utf-8', errors='ignore').read().replace('__rdtsc()', '0ULL')) for r, d, fs in os.walk('unicorn') for fn in fs if fn.endswith(('.c', '.h'))]"

            # Build Unicorn C/C++ DLL via Ninja for ARM64
            mkdir -p unicorn/build_arm64
            cd unicorn/build_arm64
            cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=ARM64 -DUNICORN_BUILD_TESTS=OFF ..
            ninja
            cd "$GITHUB_WORKSPACE"

            # Copy generated unicorn.dll into binding target path
            mkdir -p unicorn/bindings/python/unicorn
            find unicorn/build_arm64 -name "unicorn.dll" -exec cp {} unicorn/bindings/python/unicorn/ \;

            # Patch Unicorn setup.py to bypass build_libraries()
            "$PY_ABS_PATH" -c "p='unicorn/bindings/python/setup.py'; f=open(p); c=f.read().replace('build_libraries()', 'pass'); open(p,'w').write(c)"

            cd unicorn/bindings/python
            "$PY_ABS_PATH" setup.py install
            cd "$GITHUB_WORKSPACE"

          else
            # Standard PyPI install for all other architectures
            "$PY_ABS_PATH" -m pip install keystone-engine capstone unicorn
          fi

          # Install Qiling Framework
          "$PY_ABS_PATH" -m pip install qiling

      - name: Test Qiling Import
        run: |
          ./${{ matrix.py_bin }} -c "import qiling; print('Qiling loaded successfully!')"
