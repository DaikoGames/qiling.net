name: Standalone Python & Qiling Test Matrix

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test-qiling:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- LINUX ---
          - name: "Linux x64"
            os: ubuntu-latest
            arch_triple: "x86_64-unknown-linux-gnu"
            flavor: "install_only"
            py_bin: "python/bin/python3"

          - name: "Linux ARM64"
            os: ubuntu-24.04-arm
            arch_triple: "aarch64-unknown-linux-gnu"
            flavor: "install_only"
            py_bin: "python/bin/python3"

          # --- MACOS ---
          - name: "macOS x64 (Intel)"
            os: macos-15-intel
            arch_triple: "x86_64-apple-darwin"
            flavor: "install_only"
            py_bin: "python/bin/python3"

          - name: "macOS ARM64 (Apple Silicon)"
            os: macos-latest
            arch_triple: "aarch64-apple-darwin"
            flavor: "install_only"
            py_bin: "python/bin/python3"

          # --- WINDOWS ---
          - name: "Windows x64"
            os: windows-latest
            arch_triple: "x86_64-pc-windows-msvc"
            flavor: "install_only"
            py_bin: "python/python.exe"
            msvc_arch: "x64"

          - name: "Windows x86 (32-bit)"
            os: windows-latest
            arch_triple: "i686-pc-windows-msvc"
            flavor: "install_only"
            py_bin: "python/python.exe"
            msvc_arch: "x86"

          - name: "Windows ARM64"
            os: windows-11-arm
            arch_triple: "aarch64-pc-windows-msvc"
            flavor: "install_only"
            py_bin: "python/python.exe"
            msvc_arch: "arm64"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Compiler Environment (Windows Only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Download & Extract Standalone Python
        run: |
          PYTHON_VER="3.12.13"
          RELEASE_TAG="20260510"
          TRIPLE="${{ matrix.arch_triple }}"
          FLAVOR="${{ matrix.flavor }}"
          
          BASE_URL="https://github.com/astral-sh/python-build-standalone/releases/download/${RELEASE_TAG}"
          BASE_NAME="cpython-${PYTHON_VER}+${RELEASE_TAG}-${TRIPLE}-${FLAVOR}"

          FULL_TAR_GZ_URL="${BASE_URL}/${BASE_NAME}.tar.gz"
          FULL_TAR_ZST_URL="${BASE_URL}/${BASE_NAME}.tar.zst"
          FULL_ZIP_URL="${BASE_URL}/${BASE_NAME}.zip"

          echo "Target Triple: ${TRIPLE}"
          echo "Checking URL: ${FULL_TAR_GZ_URL}"

          if curl -sSL -f -o python_archive.tar.gz "$FULL_TAR_GZ_URL"; then
            echo "Downloaded from: ${FULL_TAR_GZ_URL}"
            tar -xf python_archive.tar.gz
          elif curl -sSL -f -o python_archive.tar.zst "$FULL_TAR_ZST_URL"; then
            echo "Downloaded from: ${FULL_TAR_ZST_URL}"
            tar -xf python_archive.tar.zst
          elif curl -sSL -f -o python_archive.zip "$FULL_ZIP_URL"; then
            echo "Downloaded from: ${FULL_ZIP_URL}"
            unzip -q python_archive.zip
          else
            echo "Error: Failed to download asset from ${BASE_URL}"
            exit 1
          fi

      - name: Verify Python & Pip
        run: |
          ./${{ matrix.py_bin }} --version
          ./${{ matrix.py_bin }} -m pip --version

      - name: Install Qiling Framework (Build Native ARM64 from Source)
        run: |
          # 1. Base tools setup
          ./${{ matrix.py_bin }} -m pip install --upgrade pip setuptools wheel ninja cmake

          # Set build environment for MSVC + Ninja on Windows ARM64
          if [ "${{ runner.os }}" = "Windows" ] && [ "${{ matrix.msvc_arch }}" = "arm64" ]; then
            export CMAKE_GENERATOR="Ninja"
            export CMAKE_BUILD_TYPE="Release"

            # ----------------------------------------------------
            # A. Build Capstone (Native ARM64)
            # ----------------------------------------------------
            echo "=== Installing Capstone ==="
            ./${{ matrix.py_bin }} -m pip install capstone

            # ----------------------------------------------------
            # B. Build Keystone Engine from Source
            # ----------------------------------------------------
            echo "=== Building Keystone Engine from Source ==="
            git clone --depth 1 https://github.com/keystone-engine/keystone.git
            
            # Patch Keystone's outdated CMake minimum requirement
            ./${{ matrix.py_bin }} -c "
            path = 'keystone/CMakeLists.txt'
            content = open(path).read()
            content = content.replace('cmake_minimum_required(VERSION 2.8.12)', 'cmake_minimum_required(VERSION 3.10)')
            content = content.replace('cmake_policy(SET CMP0051 OLD)', 'cmake_policy(SET CMP0051 NEW)')
            open(path, 'w').write(content)"
            cd keystone/bindings/python
            ../../${{ matrix.py_bin }} setup.py install
            cd ../../../

            # ----------------------------------------------------
            # C. Build Unicorn Engine from Source
            # ----------------------------------------------------
            echo "=== Building Unicorn Engine from Source ==="
            git clone --depth 1 https://github.com/unicorn-engine/unicorn.git

            # Patch Unicorn's setup.py to use Ninja instead of hardcoded VS 2019
            ./${{ matrix.py_bin }} -c "
            path = 'unicorn/bindings/python/setup.py'
            content = open(path).read()
            content = content.replace(\"'-G', 'Visual Studio 16 2019'\", \"'-G', 'Ninja'\")
            content = content.replace(\"'-A', 'x64'\", \"\")
            open(path, 'w').write(content)"
            
            cd unicorn/bindings/python
            ../../${{ matrix.py_bin }} setup.py install
            cd ../../../

          else
            # Non-Windows ARM64 platforms can install standard PyPI wheels
            ./${{ matrix.py_bin }} -m pip install keystone-engine capstone unicorn
          fi

          # 2. Install Qiling
          ./${{ matrix.py_bin }} -m pip install qiling
      - name: Test Qiling Import
        run: |
          ./${{ matrix.py_bin }} -c "import qiling; print('Qiling loaded successfully!')"
