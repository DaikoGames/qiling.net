name: Standalone Python & Qiling Test Matrix

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test-qiling:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- LINUX ---
          - name: "Linux x64"
            os: ubuntu-latest
            arch_triple: "x86_64-unknown-linux-gnu"
            flavor: "install_only"
            py_bin: "python/bin/python3"

          - name: "Linux ARM64"
            os: ubuntu-24.04-arm
            arch_triple: "aarch64-unknown-linux-gnu"
            flavor: "install_only"
            py_bin: "python/bin/python3"

          # --- MACOS ---
          - name: "macOS x64 (Intel)"
            os: macos-15-intel
            arch_triple: "x86_64-apple-darwin"
            flavor: "install_only"
            py_bin: "python/bin/python3"

          - name: "macOS ARM64 (Apple Silicon)"
            os: macos-latest
            arch_triple: "aarch64-apple-darwin"
            flavor: "install_only"
            py_bin: "python/bin/python3"

          # --- WINDOWS ---
          - name: "Windows x64"
            os: windows-latest
            arch_triple: "x86_64-pc-windows-msvc"
            flavor: "install_only"
            py_bin: "python/python.exe"
            msvc_arch: "x64"

          - name: "Windows x86 (32-bit)"
            os: windows-latest
            arch_triple: "i686-pc-windows-msvc"
            flavor: "install_only"
            py_bin: "python/python.exe"
            msvc_arch: "x86"

          - name: "Windows ARM64"
            os: windows-11-arm
            arch_triple: "aarch64-pc-windows-msvc"
            flavor: "install_only"
            py_bin: "python/python.exe"
            msvc_arch: "arm64"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Compiler Environment (Windows Only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Download & Extract Standalone Python
        run: |
          PYTHON_VER="3.12.13"
          RELEASE_TAG="20260510"
          TRIPLE="${{ matrix.arch_triple }}"
          FLAVOR="${{ matrix.flavor }}"
          
          BASE_URL="https://github.com/astral-sh/python-build-standalone/releases/download/${RELEASE_TAG}"
          BASE_NAME="cpython-${PYTHON_VER}+${RELEASE_TAG}-${TRIPLE}-${FLAVOR}"

          FULL_TAR_GZ_URL="${BASE_URL}/${BASE_NAME}.tar.gz"
          FULL_TAR_ZST_URL="${BASE_URL}/${BASE_NAME}.tar.zst"
          FULL_ZIP_URL="${BASE_URL}/${BASE_NAME}.zip"

          echo "Target Triple: ${TRIPLE}"
          echo "Checking URL: ${FULL_TAR_GZ_URL}"

          if curl -sSL -f -o python_archive.tar.gz "$FULL_TAR_GZ_URL"; then
            echo "Downloaded from: ${FULL_TAR_GZ_URL}"
            tar -xf python_archive.tar.gz
          elif curl -sSL -f -o python_archive.tar.zst "$FULL_TAR_ZST_URL"; then
            echo "Downloaded from: ${FULL_TAR_ZST_URL}"
            tar -xf python_archive.tar.zst
          elif curl -sSL -f -o python_archive.zip "$FULL_ZIP_URL"; then
            echo "Downloaded from: ${FULL_ZIP_URL}"
            unzip -q python_archive.zip
          else
            echo "Error: Failed to download asset from ${BASE_URL}"
            exit 1
          fi

      - name: Verify Python & Pip
        run: |
          ./${{ matrix.py_bin }} --version
          ./${{ matrix.py_bin }} -m pip --version

      - name: Install Qiling & Dependencies
        run: |
          PY_ABS_PATH="$(pwd)/${{ matrix.py_bin }}"
          echo "Python path: $PY_ABS_PATH"

          "$PY_ABS_PATH" -m pip install --upgrade pip setuptools wheel ninja cmake

          # ----------------------------------------------------
          # SPECIAL HANDLING: Windows ARM64 Source Compilation
          # ----------------------------------------------------
          if [ "${{ runner.os }}" = "Windows" ] && [ "${{ matrix.msvc_arch }}" = "arm64" ]; then
            echo "Detected Windows ARM64 target. Executing pure Bash source builds for Keystone & Unicorn..."

            export CMAKE_GENERATOR="Ninja"
            export CMAKE_BUILD_TYPE="Release"

            # 1. Capstone
            "$PY_ABS_PATH" -m pip install capstone

            # 2. Keystone Engine (Windows ARM64 Build)
            echo "=== Building Keystone Engine for Windows ARM64 ==="
            git clone --depth 1 https://github.com/keystone-engine/keystone.git
            
            sed -i 's/cmake_minimum_required(VERSION 2.8.12)/cmake_minimum_required(VERSION 3.10)/g' keystone/CMakeLists.txt
            sed -i 's/cmake_policy(SET CMP0051 OLD)/cmake_policy(SET CMP0051 NEW)/g' keystone/CMakeLists.txt

            mkdir -p keystone/build_arm64
            cd keystone/build_arm64
            cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=ARM64 -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86" ..
            ninja
            cd "$GITHUB_WORKSPACE"

            mkdir -p keystone/bindings/python/keystone
            find keystone/build_arm64 -name "*.dll" -exec cp {} keystone/bindings/python/keystone/ \;

            cd keystone/bindings/python
            "$PY_ABS_PATH" setup.py install
            cd "$GITHUB_WORKSPACE"

            # 3. Unicorn Engine (Windows ARM64 Build)
            echo "=== Building Unicorn Engine for Windows ARM64 ==="
            git clone --depth 1 https://github.com/unicorn-engine/unicorn.git

            # Patch Unicorn CMake to remove MASM requirements
            sed -i 's/enable_language(ASM_MASM)/# disabled ASM_MASM/gI' unicorn/CMakeLists.txt
            sed -i '/setjmp-wrapper-win32\.asm/d' unicorn/CMakeLists.txt
            echo "" > unicorn/qemu/util/setjmp-wrapper-win32.asm

            # Inject __rdtsc and native setjmp/longjmp wrappers into osdep.h for MSVC ARM64
            cat << 'EOF' > rdtsc_patch.h
#if defined(_MSC_VER) && defined(_M_ARM64)
#include <stdint.h>
#include <setjmp.h>
static inline uint64_t __rdtsc(void) {
    return 0ULL;
}
#define __rdtsc __rdtsc
#ifndef uc_qemu_setjmp
#define uc_qemu_setjmp(env) setjmp(env)
#endif
#ifndef uc_qemu_longjmp
#define uc_qemu_longjmp(env, val) longjmp(env, val)
#endif
#endif
EOF
            cat rdtsc_patch.h unicorn/qemu/include/qemu/osdep.h > unicorn/qemu/include/qemu/osdep.h.tmp
            mv unicorn/qemu/include/qemu/osdep.h.tmp unicorn/qemu/include/qemu/osdep.h
            rm rdtsc_patch.h

            mkdir -p unicorn/build_arm64
            cd unicorn/build_arm64
            cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=ARM64 -DUNICORN_BUILD_TESTS=OFF ..
            ninja
            cd "$GITHUB_WORKSPACE"

            mkdir -p unicorn/bindings/python/unicorn
            find unicorn/build_arm64 -name "*.dll" -exec cp {} unicorn/bindings/python/unicorn/ \;

            # Bypass setup.py build trigger via sed
            sed -i 's/build_libraries()/pass/g' unicorn/bindings/python/setup.py

            cd unicorn/bindings/python
            "$PY_ABS_PATH" setup.py install
            cd "$GITHUB_WORKSPACE"

            # 4. Install Qiling Framework
            "$PY_ABS_PATH" -m pip install qiling --no-build-isolation

          else
            # ----------------------------------------------------
            # STANDARD HANDLING: All Other Platforms (PyPI Wheels)
            # ----------------------------------------------------
            echo "Standard target detected. Installing directly from PyPI..."
            "$PY_ABS_PATH" -m pip install keystone-engine capstone unicorn qiling
          fi

      - name: Test Qiling Import
        run: |
          ./${{ matrix.py_bin }} -c "import qiling; print('Qiling loaded successfully!')"
