name: Standalone Python & Qiling Test Matrix

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test-qiling:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux x64"
            os: ubuntu-latest
            arch_triple: "x86_64-unknown-linux-gnu"
            py_bin: "python/bin/python3"

          - name: "Linux ARM64"
            os: ubuntu-24.04-arm
            arch_triple: "aarch64-unknown-linux-gnu"
            py_bin: "python/bin/python3"

          - name: "macOS x64"
            os: macos-13
            arch_triple: "x86_64-apple-darwin"
            py_bin: "python/bin/python3"

          - name: "macOS ARM64"
            os: macos-latest
            arch_triple: "aarch64-apple-darwin"
            py_bin: "python/bin/python3"

          - name: "Windows x64"
            os: windows-latest
            arch_triple: "x86_64-pc-windows-msvc"
            py_bin: "python/python.exe"

          - name: "Windows x86"
            os: windows-latest
            arch_triple: "i686-pc-windows-msvc"
            py_bin: "python/python.exe"

          - name: "Windows ARM64"
            os: windows-11-vs2022-arm64
            arch_triple: "aarch64-pc-windows-msvc"
            py_bin: "python/python.exe"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ensure zstd tool is available
        run: |
          if ! command -v zstd &> /dev/null; then
            if [[ "$RUNNER_OS" == "Windows" ]]; then
              choco install zstd -y
            elif [[ "$RUNNER_OS" == "macOS" ]]; then
              brew install zstd
            fi
          fi

      - name: Download & Extract Standalone Python
        run: |
          PYTHON_VER="3.11.8"
          RELEASE_TAG="20240224"
          TRIPLE="${{ matrix.arch_triple }}"
          
          FILE_NAME="cpython-${PYTHON_VER}+${RELEASE_TAG}-${TRIPLE}-install_only.tar.gz"
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/${RELEASE_TAG}/${FILE_NAME}"

          echo "Downloading: $URL"
          curl -sSL -o python_standalone.tar.zst "$URL"

          echo "Decompressing and Extracting..."
          zstd -d python_standalone.tar.zst --stdout | tar -xvf -

      - name: Verify Python & Pip
        run: |
          ${{ matrix.py_bin }} --version
          ${{ matrix.py_bin }} -m pip --version

      - name: Install Qiling Framework
        run: |
          ${{ matrix.py_bin }} -m pip install --upgrade pip setuptools wheel
          ${{ matrix.py_bin }} -m pip install qiling

      - name: Test Qiling Import
        run: |
          ${{ matrix.py_bin }} -c "import qiling; print('Qiling loaded successfully!')"
