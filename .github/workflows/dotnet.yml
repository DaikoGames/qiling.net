name: Standalone Python & Qiling Test Matrix

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test-qiling:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # --- LINUX ---
          - name: "Linux x64"
            os: ubuntu-latest
            arch_triple: "x86_64-unknown-linux-gnu"
            flavor: "install_only"
            py_bin: "python/bin/python3"

          - name: "Linux ARM64"
            os: ubuntu-24.04-arm
            arch_triple: "aarch64-unknown-linux-gnu"
            flavor: "install_only"
            py_bin: "python/bin/python3"

          # --- MACOS ---
          - name: "macOS x64 (Intel)"
            os: macos-15-intel
            arch_triple: "x86_64-apple-darwin"
            flavor: "install_only"
            py_bin: "python/bin/python3"

          - name: "macOS ARM64 (Apple Silicon)"
            os: macos-latest
            arch_triple: "aarch64-apple-darwin"
            flavor: "install_only"
            py_bin: "python/bin/python3"

          # --- WINDOWS ---
          - name: "Windows x64"
            os: windows-latest
            arch_triple: "x86_64-pc-windows-msvc"
            flavor: "shared-install_only"
            py_bin: "python/python.exe"
            msvc_arch: "x64"

          - name: "Windows x86 (32-bit)"
            os: windows-latest
            arch_triple: "i686-pc-windows-msvc"
            flavor: "shared-install_only"
            py_bin: "python/python.exe"
            msvc_arch: "x86"

          - name: "Windows ARM64"
            os: windows-11-arm
            arch_triple: "aarch64-pc-windows-msvc"
            flavor: "shared-install_only"
            py_bin: "python/python.exe"
            msvc_arch: "arm64"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Compiler Environment (Windows Only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Download & Extract Standalone Python
        run: |
          PYTHON_VER="3.11.8"
          RELEASE_TAG="20240224"
          TRIPLE="${{ matrix.arch_triple }}"
          FLAVOR="${{ matrix.flavor }}"
          
          BASE_URL="https://github.com/astral-sh/python-build-standalone/releases/download/${RELEASE_TAG}"
          BASE_NAME="cpython-${PYTHON_VER}+${RELEASE_TAG}-${TRIPLE}-${FLAVOR}"

          echo "Attempting download for target: ${TRIPLE} (${FLAVOR})"

          if curl -sSL -f -o python_archive "$BASE_URL/${BASE_NAME}.tar.zst"; then
            echo "Downloaded ${BASE_NAME}.tar.zst"
          elif curl -sSL -f -o python_archive "$BASE_URL/${BASE_NAME}.tar.gz"; then
            echo "Downloaded ${BASE_NAME}.tar.gz"
          else
            echo "Failed to locate archive asset on GitHub releases."
            exit 1
          fi

          echo "Extracting archive..."
          tar -xf python_archive

      - name: Verify Python & Pip
        run: |
          ./${{ matrix.py_bin }} --version
          ./${{ matrix.py_bin }} -m pip --version

      - name: Install Qiling Framework
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            export MACOSX_DEPLOYMENT_TARGET=10.13
            export CFLAGS="-mmacosx-version-min=10.13 -Wno-error=unguarded-availability-new"
            export CXXFLAGS="-mmacosx-version-min=10.13 -Wno-error=unguarded-availability-new"
          fi

          ./${{ matrix.py_bin }} -m pip install --upgrade pip setuptools wheel
          ./${{ matrix.py_bin }} -m pip install --prefer-binary qiling

      - name: Test Qiling Import
        run: |
          ./${{ matrix.py_bin }} -c "import qiling; print('Qiling loaded successfully!')"
